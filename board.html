<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة التلفزيون · حضيف فليكس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* A board for the TV browser. It holds no data of its own: everything it shows travels in the address after "#",
   which the browser never sends to the server. Written for the TV's older browser engine (no flex gap, clamp or ?.). */
:root{--bg:#090806;--card:#15120e;--line:#2a241b;--text:#f3eee5;--muted:#a59d8f;--gold:#d9b26f;--gold-hi:#ecd29e;--ink:#170f04}
*{box-sizing:border-box}
html{font-size:1.15vw;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.5;
  background:radial-gradient(ellipse at 50% -20%,rgba(217,178,111,.16),rgba(217,178,111,0) 60%),var(--bg);padding:2.2rem 2.8rem 1.6rem}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center}
.brand img{width:4.2rem;height:4.2rem;border-radius:1rem;margin-left:1.2rem;box-shadow:0 .4rem 1.4rem rgba(0,0,0,.5)}
h1{margin:0;font-size:2.5rem;font-weight:700;line-height:1.15}
.date{margin:.3rem 0 0;color:var(--muted);font-size:1.05rem}
.clock{font-size:3.4rem;font-weight:700;color:var(--gold-hi);letter-spacing:.02em;white-space:nowrap}
.sum{display:flex;margin:1.5rem 0 1.6rem}
.pill{display:inline-flex;align-items:center;padding:.45rem 1.2rem;border-radius:99rem;font-weight:700;font-size:1.1rem;margin-left:.8rem}
.pill b{font-size:1.5rem;margin-left:.5rem}
.pill.gold{background:linear-gradient(135deg,#ecd29e,#c9954f);color:var(--ink)}
.pill.ghost{border:2px solid var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:1.3rem;align-items:start}
.card{background:linear-gradient(180deg,#1a1611,#13110d 70%);border:2px solid var(--line);border-radius:1.4rem;padding:1.3rem 1.4rem 1rem}
.head{display:flex;align-items:center;justify-content:space-between;padding-bottom:.9rem;margin-bottom:.4rem;border-bottom:2px solid var(--line)}
.head h2{margin:0;font-size:1.45rem;font-weight:700;line-height:1.3}
.head p{margin:.15rem 0 0;color:var(--muted);font-size:.85rem}
.count{flex:none;min-width:2.8rem;height:2.8rem;padding:0 .6rem;border-radius:99rem;display:flex;align-items:center;justify-content:center;
  background:rgba(217,178,111,.16);color:var(--gold-hi);font-size:1.4rem;font-weight:700;margin-right:1rem}
ol{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;padding:.75rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
li:last-child{border-bottom:0}
.n{flex:none;width:2rem;height:2rem;border-radius:50%;border:2px solid rgba(217,178,111,.55);color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:.9rem;font-weight:700;margin-left:.9rem;margin-top:.15rem}
.t{flex:1;min-width:0}
.t b{display:block;font-size:1.12rem;font-weight:600;line-height:1.4}
.t span{display:block;color:var(--gold);font-size:.88rem;margin-top:.15rem}
.g{flex:none;margin-right:.7rem;margin-top:.2rem;padding:.05rem .55rem;border-radius:.5rem;background:rgba(255,255,255,.07);color:#cfc6b4;font-size:.8rem;font-weight:700}
.busy{margin:.7rem 0 0;color:var(--muted);font-size:.92rem}
.none{color:var(--muted);font-size:1.05rem;padding:.9rem 0 .4rem}
.foot{margin-top:1.4rem;color:var(--muted);font-size:.85rem}
.empty{margin-top:12vh;text-align:center;color:var(--muted);font-size:1.4rem}
@media (max-width:900px){
  html{font-size:16px}
  body{padding:1.2rem 1rem}
  .top{flex-wrap:wrap}
  .clock{font-size:2.2rem;margin-top:.8rem}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="assets/logo-mark.png" alt="">
    <div><h1 id="title">مهامك اليوم</h1><p class="date" id="date"></p></div>
  </div>
  <div class="clock" id="clock"></div>
</header>
<div class="sum" id="sum"></div>
<main class="grid" id="grid"></main>
<p class="foot" id="foot"></p>
<script>
(function(){
  "use strict";
  var DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
  var MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
  // Saudi Arabia is UTC+3 all year: read the wall clock from the UTC fields of a shifted date.
  function ksa(ms){ return new Date(ms + 108e5); }
  function clock(ms){ var d = ksa(ms), h = d.getUTCHours(), m = d.getUTCMinutes(); return (h % 12 || 12) + ":" + (m < 10 ? "0" : "") + m + (h < 12 ? " ص" : " م"); }
  function day(ms){ var d = ksa(ms); return DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()]; }
  function tasks(n){ return n === 1 ? "مهمة" : n === 2 ? "مهمتين" : n <= 10 ? n + " مهام" : n + " مهمة"; }
  function el(tag, cls, text){ var n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; }
  function $(id){ return document.getElementById(id); }

  // #d=<base64url of UTF-8 JSON>: {title, src, at, groups:[{n: name, s: subtitle, i: [[title, ref, gate]], b: busy count}]}
  function read(){
    var m = /[#&]d=([^&]+)/.exec(location.hash);
    if(!m) return null;
    try{
      var b = m[1].replace(/-/g, "+").replace(/_/g, "/");
      while(b.length % 4) b += "=";
      var bin = atob(b), bytes = new Uint8Array(bin.length);
      for(var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder("utf-8").decode(bytes));
    }catch(e){ return null; }
  }

  function tick(){ $("clock").textContent = clock(Date.now()); }
  tick(); setInterval(tick, 15000);

  var data = read();
  if(!data || !data.groups){
    $("date").textContent = day(Date.now());
    $("grid").appendChild(el("p", "empty", "ما وصلت بيانات لهاللوحة."));
    return;
  }
  if(data.title) $("title").textContent = data.title;
  document.title = (data.title || "مهامك اليوم") + " · حضيف فليكس";
  $("date").textContent = day(Date.now()) + (data.at ? " · آخر تحديث " + clock(Date.parse(data.at)) : "");

  var waiting = 0, busy = 0;
  data.groups.forEach(function(g){ waiting += (g.i || []).length; busy += g.b || 0; });
  var p1 = el("span", "pill gold"); p1.appendChild(el("b", null, String(waiting))); p1.appendChild(el("span", null, "تنتظرك"));
  $("sum").appendChild(p1);
  if(busy){ var p2 = el("span", "pill ghost"); p2.appendChild(el("b", null, String(busy))); p2.appendChild(el("span", null, "الفريق شغال عليها")); $("sum").appendChild(p2); }
  if(data.groups.length < 3) $("grid").style.gridTemplateColumns = "repeat(" + data.groups.length + ",minmax(0,1fr))";

  data.groups.forEach(function(g){
    var card = el("section", "card"), head = el("div", "head"), titles = el("div");
    titles.appendChild(el("h2", null, g.n));
    if(g.s) titles.appendChild(el("p", null, g.s));
    head.appendChild(titles);
    head.appendChild(el("span", "count", String((g.i || []).length)));
    card.appendChild(head);
    var items = g.i || [];
    if(!items.length) card.appendChild(el("p", "none", "ما فيه شي ينتظرك هنا."));
    else {
      var ol = el("ol");
      items.forEach(function(it, k){
        var li = el("li"), t = el("div", "t");
        li.appendChild(el("span", "n", String(k + 1)));
        t.appendChild(el("b", null, it[0]));
        if(it[1]) t.appendChild(el("span", null, it[1]));
        li.appendChild(t);
        if(it[2]) li.appendChild(el("span", "g", it[2]));
        ol.appendChild(li);
      });
      card.appendChild(ol);
    }
    if(g.b) card.appendChild(el("p", "busy", "والفريق شغال على " + tasks(g.b) + " ثانية"));
    $("grid").appendChild(card);
  });
  if(data.src) $("foot").textContent = "المصدر: " + data.src;

  // On a TV the whole board should fit one screen: shrink the type a little at a time until it does.
  function fit(){
    var root = document.documentElement, size = innerWidth * 0.0115, tries = 0;
    if(innerWidth <= 900){ root.style.fontSize = ""; return; }
    root.style.fontSize = size + "px";
    while(root.scrollHeight > innerHeight + 2 && tries++ < 24){ size *= 0.95; root.style.fontSize = size + "px"; }
  }
  fit();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  addEventListener("resize", fit);
})();
</script>
</body>
</html>
